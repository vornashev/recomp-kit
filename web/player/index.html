<!doctype html>
<!-- The player page for one game's web build. tools/web_launcher.py places it,
     with @APP@.js/.wasm/.data, in <launcher>/<game id>/; the game's files were
     imported by the launcher into the browser's private storage at
     <game id>/game, and the profile lives at <game id>/profile. The page must
     be served cross-origin isolated (COOP same-origin, COEP require-corp). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@TITLE@</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 14px system-ui, sans-serif; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 0 16px; white-space: pre-line; pointer-events: none; }
  #status a { pointer-events: auto; color: #8cf; }
  #perf { position: fixed; left: 8px; top: 8px; height: 28px; padding: 0 10px; z-index: 10;
          border: 1px solid #3a4a5a; border-radius: 6px; background: rgba(10, 16, 24, .82);
          color: #7fe0c0; font: 600 13px ui-monospace, monospace; cursor: pointer; opacity: .75; }
  #perf:hover { opacity: 1; }
  #saves-button { position: fixed; left: 92px; top: 8px; height: 28px; padding: 0 10px; z-index: 10;
                  border: 1px solid #5a4a2a; border-radius: 6px; background: rgba(24, 18, 8, .82);
                  color: #f0d890; font: 600 13px system-ui, sans-serif; cursor: pointer; opacity: .75; }
  #saves-button:hover { opacity: 1; }
  #saves { position: fixed; left: 8px; top: 44px; z-index: 11; width: min(420px, calc(100vw - 16px));
           max-height: calc(100vh - 60px); overflow: auto; box-sizing: border-box; padding: 12px;
           border: 1px solid #5a4a2a; border-radius: 8px; background: rgba(24, 18, 8, .95);
           color: #f0e6cf; font: 14px system-ui, sans-serif; }
  #saves h2 { margin: 0 0 8px; font-size: 15px; color: #f0d890; }
  #saves p { margin: 6px 0; color: #b9a888; font-size: 12px; }
  #saves ul { list-style: none; margin: 8px 0; padding: 0; }
  #saves li { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-top: 1px solid #3a3020; }
  #saves li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #saves small { color: #b9a888; }
  #saves button, #saves label { background: #3a2e18; color: #f0e6cf; border: 1px solid #6a5a3a;
           border-radius: 5px; padding: 3px 8px; font: inherit; font-size: 12px; cursor: pointer; }
  #saves label input { display: none; }
</style>
<!-- A game's theme, when it has one (host/CMakeLists.txt). It may set
     window.recompUI before the page starts:
       onProgress(state)       while loading: state.stage is link, engine, compile,
                               archives, ready or running; see loaderState below
       onProblem(kind, detail) unsupported {checks}, portal {retry}, tab {takeOver},
                               fatal {message}
       onReady({start})        the game is loaded and waits: call start() from a
                               click, which lets the browser play sound
       onRunning()             the game has started
       onStream(stats)         every quarter second while running
       onPacing(pacing)        the frame statistics, every quarter second while
                               running; having it hands the overlay to the theme
       onExit(code, exited)    the game ended (called by the engine)
       onPanel(name)          the active top panel changed (null when all closed)
     and use window.recompPlayer (setFill, persist, clearCache, downloadLog,
     registerPanel(name, setOpen), setPanel(name), togglePanel(name)). -->
@THEME_HEAD@
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="status">Loading…</div>
<button id="perf" type="button" hidden title="Show or hide the frame statistics"></button>
<button id="saves-button" type="button" hidden></button>
<div id="saves" hidden></div>
<script>
"use strict";
const statusEl = document.getElementById("status");
const canvas = document.getElementById("canvas");
function status(text, back) {
  statusEl.textContent = text;
  if (back) {
    const a = document.createElement("a");
    a.href = "../";
    a.textContent = "\nBack to the launcher";
    statusEl.append(document.createElement("br"), a);
  }
  statusEl.hidden = !text;
}
const log = [];
window.recompLog = log; // for tests
const UI = window.recompUI || {};
const call = (name, ...args) => { try { return UI[name]?.(...args); } catch (e) { console.error(e); } };

// What a theme draws the loader from. Bytes are as the browser decodes them.
const loaderState = {
  stage: "link",
  streamed: false,
  engine: { loaded: 0, total: 0 },  // the .wasm
  compileSince: 0,                  // performance.now() when compiling began
  stream: null,                     // web_remote_fs.cpp's counters, once running
  starting: false,                  // the start button was pressed; the first frame is coming
  waitingMs: 0,                     // how long the game has waited on the network
  lastProgress: performance.now(),  // when any byte last arrived
  build: {},                        // build.json: sizes and when it was built
};
let progressQueued = false;
function progress() {
  if (progressQueued) return;
  progressQueued = true;
  requestAnimationFrame(() => { progressQueued = false; call("onProgress", loaderState); });
}
function setStage(stage) {
  if (loaderState.stage === stage) return;
  loaderState.stage = stage;
  progress();
}

// Counts the engine's bytes as they arrive: the engine keeps the original
// response (so the browser still compiles it while streaming and caches the
// compiled code), the count reads a clone.
const pageFetch = window.fetch;
window.fetch = function (input, init) {
  const url = typeof input === "string" ? input : input?.url || String(input);
  const p = pageFetch.apply(this, arguments);
  if (!/\.wasm(\?|$)/.test(url)) return p;
  return p.then((r) => {
    if (!r.ok || !r.body) return r;
    try {
      const reader = r.clone().body.getReader();
      const pump = () => reader.read().then(({ done, value }) => {
        if (done) { loaderState.compileSince = performance.now(); setStage("compile"); return; }
        loaderState.engine.loaded += value.byteLength;
        loaderState.lastProgress = performance.now();
        progress();
        pump();
      }, () => {});
      pump();
    } catch {}
    return r;
  });
};

// The stream's counters (recomp_web_stream_stats), by slot.
const STREAM_SLOTS = ["mounted", "packTotal", "packDone", "hotTotal", "hotDone", "gameTotal", "kept",
                      "keptKnown", "fetched", "waitSince", "waitBytes", "fillMode", "fillDone"];
function readStream(m) {
  if (!m._recomp_web_stream_stats || !m.HEAPF64) return null;
  const at = m._recomp_web_stream_stats() >> 3;
  const out = {};
  STREAM_SLOTS.forEach((k, i) => { out[k] = m.HEAPF64[at + i]; });
  return out;
}
let waitSeen = 0, lastFetched = 0;
function pollStream(m) {
  const st = readStream(m);
  if (!st) return null;
  // The engine stamps the wait with its own thread's clock; the page times it.
  const now = performance.now();
  if (st.waitSince) { if (!waitSeen) waitSeen = now; } else waitSeen = 0;
  loaderState.waitingMs = waitSeen ? now - waitSeen : 0;
  if (st.fetched !== lastFetched) { lastFetched = st.fetched; loaderState.lastProgress = now; }
  loaderState.stream = st;
  return st;
}

// One owner for top-panel visibility, including panels supplied by a theme.
// Select synchronously: an async storage read must never reopen a closed panel.
const panels = new Map();
let activePanel = null;

// For a theme: the things a player can ask of the page.
const player = window.recompPlayer = {
  log,
  state: loaderState,
  module: null,
  gameId: "",
  registerPanel(name, setOpen) {
    panels.set(name, setOpen);
    setOpen(activePanel === name);
  },
  setPanel(name) {
    if (name !== null && !panels.has(name)) return;
    activePanel = name;
    for (const [id, setOpen] of panels) setOpen(id === name);
    call("onPanel", name);
  },
  togglePanel(name) {
    const open = activePanel !== name;
    player.setPanel(open ? name : null);
    return open;
  },
  // 0 off, 1 in the game's quiet moments, 2 now; 0 and 1 are remembered.
  setFill(mode) {
    if (mode !== 2) try { localStorage.setItem(`recomp.fill.${player.gameId}`, String(mode)); } catch {}
    player.module?._recomp_web_stream_fill?.(mode);
  },
  fillPreference() {
    let v = null;
    try { v = localStorage.getItem(`recomp.fill.${player.gameId}`); } catch {}
    if (v !== null) return Number(v);
    // Not on a metered connection unless asked.
    const c = navigator.connection;
    return c && (c.saveData || c.type === "cellular") ? 0 : 1;
  },
  async persisted() { return !!(await navigator.storage.persisted?.()); },
  async persist() { return !!(await navigator.storage.persist?.().catch(() => false)); },
  async storage() { return (await navigator.storage.estimate?.()) || {}; },
  // The streamed copy goes on the next load: nothing may hold it while the game runs.
  clearCache() {
    try { localStorage.setItem(`recomp.clear.${player.gameId}`, "1"); } catch {}
    location.reload();
  },
  downloadLog() {
    const head = [`${document.title} — ${location.href}`, `built ${loaderState.build.built || "?"}`,
                  navigator.userAgent, new Date().toString(), ""];
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([head.concat(log).join("\n")], { type: "text/plain" }));
    a.download = `${player.gameId || "game"}-log.txt`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  },
};

// Before anything is downloaded: what the game cannot run without. WebGPU
// counts only with an adapter: a browser can have the API and no device.
let gpuAdapter = null;
async function capabilities() {
  if (navigator.gpu)
    gpuAdapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" }).catch(() => null);
  const checks = [
    { id: "threads", ok: crossOriginIsolated && typeof SharedArrayBuffer === "function" },
    { id: "webgpu", ok: !!gpuAdapter },
    { id: "opfs", ok: !!navigator.storage?.getDirectory },
    { id: "audioworklet", ok: typeof AudioWorkletNode === "function" },
  ];
  if (checks[2].ok) {
    try { await navigator.storage.getDirectory(); } catch { checks[2].ok = false; }
  }
  return checks;
}

// One tab per game: two would write the same streamed copy and profile. The
// lock is held for the page's life; another tab asks for it over the channel.
function holdTab(id) {
  if (!navigator.locks) return Promise.resolve();
  const name = `recomp-${id}`;
  const channel = new BroadcastChannel(name);
  let release;
  const held = new Promise((r) => { release = r; });
  return new Promise((resolve) => {
    navigator.locks.request(name, { ifAvailable: true }, (lock) => {
      if (lock) { resolve(); channel.onmessage = yieldTab; return held; }
      call("onProblem", "tab", {
        takeOver() {
          channel.postMessage("yield");
          navigator.locks.request(name, () => { resolve(); channel.onmessage = yieldTab; return held; });
        },
      });
      if (!UI.onProblem) status("The game is already open in another tab.");
    });
  });
  function yieldTab(e) {
    if (e.data !== "yield") return;
    status("The game moved to another tab.", true);
    setTimeout(() => location.replace("../"), 300);
  }
}

async function gameId() {
  const parts = location.pathname.split("/").filter(Boolean);
  if (parts.length && parts[parts.length - 1].includes(".")) parts.pop();
  return decodeURIComponent(parts[parts.length - 1] || "");
}

async function start() {
  const checks = await capabilities();
  if (checks.some((c) => !c.ok)) {
    if (UI.onProblem) { call("onProblem", "unsupported", { checks }); return; }
    if (!crossOriginIsolated) throw new Error("This page must be served cross-origin isolated (COOP/COEP headers).");
    if (!navigator.gpu) throw new Error("This browser has no WebGPU.");
  }
  progress();
  const id = await gameId();
  player.gameId = id;
  await holdTab(id);
  try {
    if (localStorage.getItem(`recomp.clear.${id}`) === "1") {
      localStorage.removeItem(`recomp.clear.${id}`);
      const root = await navigator.storage.getDirectory();
      const dir = await root.getDirectoryHandle(id).catch(() => null);
      await dir?.removeEntry("stream", { recursive: true }).catch(() => {});
    }
  } catch {}
  loaderState.build = await fetch("build.json").then((r) => (r.ok ? r.json() : {})).catch(() => ({}));
  loaderState.engine.total = loaderState.build.wasmBytes || 0;
  const games = await fetch("../games.json").then((r) => r.json());
  const game = games.find((g) => g.id === id);
  if (!game) throw new Error(`No game "${id}" in the launcher's games.json.`);
  document.title = game.title;

  // An imported copy is used when there is one. Otherwise, when the server
  // carries the game folder (game/manifest.txt beside this page), it is
  // streamed: only what the game reads is downloaded, and kept for next time.
  let imported = true;
  try {
    let dir = await navigator.storage.getDirectory();
    for (const p of [id, "game"]) dir = await dir.getDirectoryHandle(p);
    await dir.getFileHandle(game.executable);
  } catch {
    imported = false;
  }
  const remoteUrl = new URL("game/", location.href).href;
  if (!imported) {
    const probe = await fetch(remoteUrl + "manifest.txt", { method: "HEAD" }).catch(() => null);
    if (!probe || !probe.ok) {
      if (UI.onProblem) {
        // The server is away: the theme retries (a fresh load, nothing is half-done).
        call("onProblem", "portal", { retry: () => location.reload() });
        return;
      }
      throw new Error(`${game.title} has not been imported yet.`);
    }
    await navigator.storage.persist?.().catch(() => {});
  }
  loaderState.streamed = !imported;
  setStage("engine");

  const adapter = gpuAdapter;
  if (!adapter) throw new Error("WebGPU gave no adapter.");
  const wanted = ["texture-compression-bc", "depth32float-stencil8", "float32-filterable",
                  "unorm16-texture-formats", "rg11b10ufloat-renderable"];
  const requiredFeatures = wanted.filter((f) => adapter.features.has(f));
  const requiredLimits = {};
  for (const k of ["maxTextureDimension2D", "maxBufferSize", "maxStorageBufferBindingSize",
                   "maxUniformBufferBindingSize", "maxBindGroups", "maxSampledTexturesPerShaderStage",
                   "maxSamplersPerShaderStage", "maxStorageBuffersPerShaderStage",
                   "maxUniformBuffersPerShaderStage", "maxDynamicUniformBuffersPerPipelineLayout",
                   "maxVertexBuffers", "maxVertexAttributes", "maxColorAttachments",
                   "maxInterStageShaderVariables"])
    if (k in adapter.limits) requiredLimits[k] = adapter.limits[k];
  const device = await adapter.requestDevice({ requiredFeatures, requiredLimits });
  device.lost.then((info) => {
    if (UI.onProblem) call("onProblem", "fatal", { message: `The graphics device was lost: ${info.message}` });
    else status(`The graphics device was lost: ${info.message}`, true);
  });
  device.addEventListener("uncapturederror", (e) => console.error("WebGPU:", e.error.message));

  const exe = imported ? `/opfs/${id}/game/${game.executable}` : `/remote/${game.executable}`;
  const Module = {
    canvas,
    preinitializedWebGPUDevice: device,
    noInitialRun: true,
    print: (t) => { log.push(t); console.log(t); },
    printErr: (t) => { log.push(t); console.warn(t); },
    setStatus: (t) => { if (!UI.onProgress) status(t ? t : ""); },
    onAbort: (what) => {
      if (UI.onProblem) call("onProblem", "fatal", { message: `The game stopped: ${what}` });
      else status(`The game stopped: ${what}`, true);
    },
    preRun: [() => {
      const m = Module;
      m.ENV.RECOMP_PROFILE_DIR = `/opfs/${id}/profile`;
      if (!imported) {
        m.ENV.RECOMP_REMOTE_GAME = remoteUrl;
        m.ENV.RECOMP_REMOTE_CACHE = `/opfs/${id}/stream`;
      }
      m.ENV.RECOMP_REMOTE_FILL = String(player.fillPreference());
      // A theme that shows a start button holds the game until it is pressed.
      if (UI.onReady) m.ENV.RECOMP_WEB_GATE = "1";
      const extra = new URLSearchParams(location.search);
      for (const [k, v] of extra) if (k.startsWith("RECOMP_")) m.ENV[k] = v;
    }],
    onRuntimeInitialized() {
      if (!UI.onProgress) status("");
      player.module = Module;
      setupPerfButton(Module);
      setupSaves(id, game);
      canvas.focus();
      setStage("archives");
      Module.callMain([`--exe=${exe}`]);
      watchBoot(Module);
    },
  };
  if (UI.onProgress) status("");
  window.Module = Module;
  const script = document.createElement("script");
  script.src = "@APP@.js";
  script.onerror = () => status("The game's web build is missing.", true);
  document.body.append(script);
}

// From callMain to the game running: the stream's counters while the game
// loads, the start gate, then the counters for the theme's in-game widgets.
function watchBoot(m) {
  let readyCalled = false, startedAt = 0;
  const tick = () => {
    pollStream(m);
    const boot = m._recomp_web_boot_state ? m._recomp_web_boot_state() : 2;
    // Running from the first frame: the game spends a few seconds setting up
    // after it starts, and the loader stays up (state.starting) until then.
    const presented = !m._recomp_web_presents || m._recomp_web_presents() > 0;
    if (boot === 1 && !readyCalled) {
      readyCalled = true;
      setStage("ready");
      call("onReady", { start: () => { loaderState.starting = true; progress(); m._recomp_web_start?.(); } });
    } else if (boot === 2 && loaderState.stage !== "running" &&
               (presented || performance.now() - startedAt > 20000)) {
      setStage("running");
      call("onRunning");
    }
    if (boot === 2 && !startedAt) startedAt = performance.now();
    if (loaderState.stage === "running") {
      if (loaderState.streamed) call("onStream", loaderState.stream);
      if (UI.onPacing && m._recomp_web_pacing) call("onPacing", readPacing(m));
      setTimeout(tick, 250);
    } else {
      progress();
      setTimeout(tick, 100);
    }
  };
  tick();
}

// The frame statistics (recomp_web_pacing), for a theme that draws them. The
// first read hands the overlay over: the engine stops drawing its own.
let pacingTaken = false;
function readPacing(m) {
  if (!pacingTaken) { pacingTaken = true; m._recomp_web_overlay_external?.(1); }
  const at = m._recomp_web_pacing() >> 3, h = m.HEAPF64;
  const n = h[at + 10];
  return {
    newFps: h[at], displayFps: h[at + 1], medianMs: h[at + 2], p95Ms: h[at + 3], gpuMs: h[at + 4],
    ageMs: h[at + 5], repeatPercent: h[at + 6], drops: h[at + 7], cap: h[at + 8], mode: h[at + 9],
    intervals: Array.from(h.subarray(at + 11, at + 11 + n)),
    hidden: player.overlayHidden,
  };
}

// The performance overlay (drawn by the game in the top-left corner) folds
// away behind this button; the choice is remembered in this browser.
function setupPerfButton(m) {
  const button = document.getElementById("perf");
  if (!m._recomp_web_overlay_hidden || !m._recomp_web_overlay_mode) return;
  let hidden = false;
  try { hidden = localStorage.getItem("recomp.perf.hidden") === "1"; } catch {}
  const external = !!(UI.onPacing && m._recomp_web_pacing);
  if (external) m._recomp_web_overlay_external?.(1);
  player.registerPanel("perf", (open) => {
    m._recomp_web_overlay_hidden(open ? 0 : 1);
    player.overlayHidden = !open;
    button.textContent = open ? "▾ FPS" : "▸ FPS";
    button.setAttribute("aria-expanded", String(open));
    button.setAttribute("aria-pressed", String(open));
    try { localStorage.setItem("recomp.perf.hidden", open ? "0" : "1"); } catch {}
  });
  button.addEventListener("click", () => {
    player.togglePanel("perf");
    canvas.focus();
  });
  if (!hidden && (external || m._recomp_web_overlay_mode())) player.setPanel("perf");
  // A theme draws its own statistics even when the native overlay is disabled.
  const sync = () => {
    button.hidden = !external && !m._recomp_web_overlay_mode();
    if (button.hidden && activePanel === "perf") player.setPanel(null);
  };
  sync();
  setInterval(sync, 1000);
}

// Saves live in the browser's private storage, in the profile the game writes
// through (<id>/profile/<saves dir>). This panel lists them, imports a save
// file from disk (to continue a game from elsewhere) and exports one back.
const ru = (navigator.language || "").toLowerCase().startsWith("ru");
const T = ru ? {
  button: "Сохранения", title: "Сохранения в этом браузере", none: "Сохранений пока нет.",
  upload: "Загрузить файл…", download: "Скачать", remove: "Удалить",
  confirm: (n) => `Удалить сохранение «${n}»?`,
  note: "Хранятся в памяти этого браузера. Загруженный файл появится в окне «Загрузить игру».",
  persisted: "Хранилище помечено как постоянное.",
  notPersisted: "Браузер может очистить хранилище при нехватке места: скачивайте важные сохранения.",
} : {
  button: "Saves", title: "Saves in this browser", none: "No saves yet.",
  upload: "Import file…", download: "Download", remove: "Delete",
  confirm: (n) => `Delete the save "${n}"?`,
  note: "Kept in this browser's storage. An imported file shows up in the game's load dialog.",
  persisted: "Storage is marked persistent.",
  notPersisted: "The browser may clear its storage when space runs low: download saves you care about.",
};
async function savesDir(id, dir, create) {
  let h = await navigator.storage.getDirectory();
  for (const p of [id, "profile", ...dir.split("/").filter(Boolean)])
    h = await h.getDirectoryHandle(p, { create });
  return h;
}
function setupSaves(id, game) {
  if (!game.savesDir) return;
  const button = document.getElementById("saves-button");
  const panel = document.getElementById("saves");
  button.textContent = T.button;
  button.hidden = false;
  button.setAttribute("aria-controls", "saves");
  player.registerPanel("saves", (open) => {
    panel.hidden = !open;
    button.setAttribute("aria-expanded", String(open));
    button.setAttribute("aria-pressed", String(open));
  });
  const ext = (game.saveExt || "").toLowerCase();
  let renderVersion = 0;
  const render = async () => {
    const version = ++renderVersion;
    const h2 = document.createElement("h2");
    h2.textContent = T.title;
    const list = document.createElement("ul");
    let dir = null;
    try { dir = await savesDir(id, game.savesDir, false); } catch {}
    const files = [];
    if (dir)
      for await (const [name, h] of dir.entries())
        if (h.kind === "file" && (!ext || name.toLowerCase().endsWith(ext)))
          files.push({ name, file: await h.getFile() });
    files.sort((a, b) => b.file.lastModified - a.file.lastModified);
    for (const { name, file } of files) {
      const li = document.createElement("li");
      const label = document.createElement("span");
      label.textContent = name;
      label.title = name;
      const when = document.createElement("small");
      when.textContent = new Date(file.lastModified).toLocaleString();
      const down = document.createElement("button");
      down.textContent = T.download;
      down.onclick = () => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(file);
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      };
      const del = document.createElement("button");
      del.textContent = T.remove;
      del.onclick = async () => {
        if (!confirm(T.confirm(name))) return;
        await dir.removeEntry(name).catch(() => {});
        render();
      };
      li.append(label, when, down, del);
      list.append(li);
    }
    if (!files.length) {
      const li = document.createElement("li");
      li.textContent = T.none;
      list.append(li);
    }
    const upload = document.createElement("label");
    upload.textContent = T.upload;
    const input = document.createElement("input");
    input.type = "file";
    input.multiple = true;
    if (ext) input.accept = ext;
    input.onchange = async () => {
      const target = await savesDir(id, game.savesDir, true);
      for (const f of input.files) {
        const w = await (await target.getFileHandle(f.name, { create: true })).createWritable();
        await w.write(f);
        await w.close();
      }
      render();
    };
    upload.append(input);
    const note = document.createElement("p");
    note.textContent = T.note;
    const persist = document.createElement("p");
    persist.textContent = (await navigator.storage.persisted?.()) ? T.persisted : T.notPersisted;
    if (version === renderVersion) panel.replaceChildren(h2, list, upload, note, persist);
  };
  button.addEventListener("click", async () => {
    if (player.togglePanel("saves")) {
      if (!panel.hasChildNodes()) panel.textContent = T.title;
      await navigator.storage.persist?.().catch(() => {});
      await render();
    } else canvas.focus();
  });
}

canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("click", () => canvas.focus());
start().catch((e) => {
  if (UI.onProblem) call("onProblem", "fatal", { message: e.message });
  else status(e.message, true);
});
</script>
</body>
</html>
