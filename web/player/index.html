<!doctype html>
<!-- The player page for one game's web build. tools/web_launcher.py places it,
     with @APP@.js/.wasm/.data, in <launcher>/<game id>/; the game's files were
     imported by the launcher into the browser's private storage at
     <game id>/game, and the profile lives at <game id>/profile. The page must
     be served cross-origin isolated (COOP same-origin, COEP require-corp). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@TITLE@</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 14px system-ui, sans-serif; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 0 16px; white-space: pre-line; pointer-events: none; }
  #status a { pointer-events: auto; color: #8cf; }
  #perf { position: fixed; left: 8px; top: 8px; height: 28px; padding: 0 10px; z-index: 10;
          border: 1px solid #3a4a5a; border-radius: 6px; background: rgba(10, 16, 24, .82);
          color: #7fe0c0; font: 600 13px ui-monospace, monospace; cursor: pointer; opacity: .75; }
  #perf:hover { opacity: 1; }
  #saves-button { position: fixed; left: 92px; top: 8px; height: 28px; padding: 0 10px; z-index: 10;
                  border: 1px solid #5a4a2a; border-radius: 6px; background: rgba(24, 18, 8, .82);
                  color: #f0d890; font: 600 13px system-ui, sans-serif; cursor: pointer; opacity: .75; }
  #saves-button:hover { opacity: 1; }
  #saves { position: fixed; left: 8px; top: 44px; z-index: 11; width: min(420px, calc(100vw - 16px));
           max-height: calc(100vh - 60px); overflow: auto; box-sizing: border-box; padding: 12px;
           border: 1px solid #5a4a2a; border-radius: 8px; background: rgba(24, 18, 8, .95);
           color: #f0e6cf; font: 14px system-ui, sans-serif; }
  #saves h2 { margin: 0 0 8px; font-size: 15px; color: #f0d890; }
  #saves p { margin: 6px 0; color: #b9a888; font-size: 12px; }
  #saves ul { list-style: none; margin: 8px 0; padding: 0; }
  #saves li { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-top: 1px solid #3a3020; }
  #saves li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #saves small { color: #b9a888; }
  #saves button, #saves label { background: #3a2e18; color: #f0e6cf; border: 1px solid #6a5a3a;
           border-radius: 5px; padding: 3px 8px; font: inherit; font-size: 12px; cursor: pointer; }
  #saves label input { display: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="status">Loading…</div>
<button id="perf" type="button" hidden title="Show or hide the frame statistics"></button>
<button id="saves-button" type="button" hidden></button>
<div id="saves" hidden></div>
<script>
"use strict";
const statusEl = document.getElementById("status");
const canvas = document.getElementById("canvas");
function status(text, back) {
  statusEl.textContent = text;
  if (back) {
    const a = document.createElement("a");
    a.href = "../";
    a.textContent = "\nBack to the launcher";
    statusEl.append(document.createElement("br"), a);
  }
  statusEl.hidden = !text;
}
const log = [];
window.recompLog = log; // for tests

async function gameId() {
  const parts = location.pathname.split("/").filter(Boolean);
  if (parts.length && parts[parts.length - 1].includes(".")) parts.pop();
  return decodeURIComponent(parts[parts.length - 1] || "");
}

async function start() {
  if (!crossOriginIsolated) throw new Error("This page must be served cross-origin isolated (COOP/COEP headers).");
  if (!navigator.gpu) throw new Error("This browser has no WebGPU.");
  const id = await gameId();
  const games = await fetch("../games.json").then((r) => r.json());
  const game = games.find((g) => g.id === id);
  if (!game) throw new Error(`No game "${id}" in the launcher's games.json.`);
  document.title = game.title;

  // An imported copy is used when there is one. Otherwise, when the server
  // carries the game folder (game/manifest.txt beside this page), it is
  // streamed: only what the game reads is downloaded, and kept for next time.
  let imported = true;
  try {
    let dir = await navigator.storage.getDirectory();
    for (const p of [id, "game"]) dir = await dir.getDirectoryHandle(p);
    await dir.getFileHandle(game.executable);
  } catch {
    imported = false;
  }
  const remoteUrl = new URL("game/", location.href).href;
  if (!imported) {
    const probe = await fetch(remoteUrl + "manifest.txt", { method: "HEAD" }).catch(() => null);
    if (!probe || !probe.ok) throw new Error(`${game.title} has not been imported yet.`);
    await navigator.storage.persist?.().catch(() => {});
  }

  const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
  if (!adapter) throw new Error("WebGPU gave no adapter.");
  const wanted = ["texture-compression-bc", "depth32float-stencil8", "float32-filterable",
                  "unorm16-texture-formats", "rg11b10ufloat-renderable"];
  const requiredFeatures = wanted.filter((f) => adapter.features.has(f));
  const requiredLimits = {};
  for (const k of ["maxTextureDimension2D", "maxBufferSize", "maxStorageBufferBindingSize",
                   "maxUniformBufferBindingSize", "maxBindGroups", "maxSampledTexturesPerShaderStage",
                   "maxSamplersPerShaderStage", "maxStorageBuffersPerShaderStage",
                   "maxUniformBuffersPerShaderStage", "maxDynamicUniformBuffersPerPipelineLayout",
                   "maxVertexBuffers", "maxVertexAttributes", "maxColorAttachments",
                   "maxInterStageShaderVariables"])
    if (k in adapter.limits) requiredLimits[k] = adapter.limits[k];
  const device = await adapter.requestDevice({ requiredFeatures, requiredLimits });
  device.lost.then((info) => status(`The graphics device was lost: ${info.message}`, true));
  device.addEventListener("uncapturederror", (e) => console.error("WebGPU:", e.error.message));

  const exe = imported ? `/opfs/${id}/game/${game.executable}` : `/remote/${game.executable}`;
  const Module = {
    canvas,
    preinitializedWebGPUDevice: device,
    noInitialRun: true,
    print: (t) => { log.push(t); console.log(t); },
    printErr: (t) => { log.push(t); console.warn(t); },
    setStatus: (t) => status(t ? t : ""),
    onAbort: (what) => status(`The game stopped: ${what}`, true),
    preRun: [() => {
      const m = Module;
      m.ENV.RECOMP_PROFILE_DIR = `/opfs/${id}/profile`;
      if (!imported) {
        m.ENV.RECOMP_REMOTE_GAME = remoteUrl;
        m.ENV.RECOMP_REMOTE_CACHE = `/opfs/${id}/stream`;
      }
      const extra = new URLSearchParams(location.search);
      for (const [k, v] of extra) if (k.startsWith("RECOMP_")) m.ENV[k] = v;
    }],
    onRuntimeInitialized() {
      status("");
      setupPerfButton(Module);
      setupSaves(id, game);
      canvas.focus();
      Module.callMain([`--exe=${exe}`]);
    },
  };
  window.Module = Module;
  const script = document.createElement("script");
  script.src = "@APP@.js";
  script.onerror = () => status("The game's web build is missing.", true);
  document.body.append(script);
}

// The performance overlay (drawn by the game in the top-left corner) folds
// away behind this button; the choice is remembered in this browser.
function setupPerfButton(m) {
  const button = document.getElementById("perf");
  if (!m._recomp_web_overlay_hidden || !m._recomp_web_overlay_mode) return;
  let hidden = false;
  try { hidden = localStorage.getItem("recomp.perf.hidden") === "1"; } catch {}
  const apply = () => {
    m._recomp_web_overlay_hidden(hidden ? 1 : 0);
    button.textContent = hidden ? "▸ FPS" : "▾ FPS";
    button.setAttribute("aria-expanded", String(!hidden));
  };
  button.addEventListener("click", () => {
    hidden = !hidden;
    try { localStorage.setItem("recomp.perf.hidden", hidden ? "1" : "0"); } catch {}
    apply();
    canvas.focus();
  });
  apply();
  // Only while the overlay is switched on in the settings.
  const sync = () => { button.hidden = !m._recomp_web_overlay_mode(); };
  sync();
  setInterval(sync, 1000);
}

// Saves live in the browser's private storage, in the profile the game writes
// through (<id>/profile/<saves dir>). This panel lists them, imports a save
// file from disk (to continue a game from elsewhere) and exports one back.
const ru = (navigator.language || "").toLowerCase().startsWith("ru");
const T = ru ? {
  button: "Сохранения", title: "Сохранения в этом браузере", none: "Сохранений пока нет.",
  upload: "Загрузить файл…", download: "Скачать", remove: "Удалить",
  confirm: (n) => `Удалить сохранение «${n}»?`,
  note: "Хранятся в памяти этого браузера. Загруженный файл появится в окне «Загрузить игру».",
  persisted: "Хранилище помечено как постоянное.",
  notPersisted: "Браузер может очистить хранилище при нехватке места: скачивайте важные сохранения.",
} : {
  button: "Saves", title: "Saves in this browser", none: "No saves yet.",
  upload: "Import file…", download: "Download", remove: "Delete",
  confirm: (n) => `Delete the save "${n}"?`,
  note: "Kept in this browser's storage. An imported file shows up in the game's load dialog.",
  persisted: "Storage is marked persistent.",
  notPersisted: "The browser may clear its storage when space runs low: download saves you care about.",
};
async function savesDir(id, dir, create) {
  let h = await navigator.storage.getDirectory();
  for (const p of [id, "profile", ...dir.split("/").filter(Boolean)])
    h = await h.getDirectoryHandle(p, { create });
  return h;
}
function setupSaves(id, game) {
  if (!game.savesDir) return;
  const button = document.getElementById("saves-button");
  const panel = document.getElementById("saves");
  button.textContent = T.button;
  button.hidden = false;
  const ext = (game.saveExt || "").toLowerCase();
  const render = async () => {
    panel.replaceChildren();
    const h2 = document.createElement("h2");
    h2.textContent = T.title;
    const list = document.createElement("ul");
    let dir = null;
    try { dir = await savesDir(id, game.savesDir, false); } catch {}
    const files = [];
    if (dir)
      for await (const [name, h] of dir.entries())
        if (h.kind === "file" && (!ext || name.toLowerCase().endsWith(ext)))
          files.push({ name, file: await h.getFile() });
    files.sort((a, b) => b.file.lastModified - a.file.lastModified);
    for (const { name, file } of files) {
      const li = document.createElement("li");
      const label = document.createElement("span");
      label.textContent = name;
      label.title = name;
      const when = document.createElement("small");
      when.textContent = new Date(file.lastModified).toLocaleString();
      const down = document.createElement("button");
      down.textContent = T.download;
      down.onclick = () => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(file);
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      };
      const del = document.createElement("button");
      del.textContent = T.remove;
      del.onclick = async () => {
        if (!confirm(T.confirm(name))) return;
        await dir.removeEntry(name).catch(() => {});
        render();
      };
      li.append(label, when, down, del);
      list.append(li);
    }
    if (!files.length) {
      const li = document.createElement("li");
      li.textContent = T.none;
      list.append(li);
    }
    const upload = document.createElement("label");
    upload.textContent = T.upload;
    const input = document.createElement("input");
    input.type = "file";
    input.multiple = true;
    if (ext) input.accept = ext;
    input.onchange = async () => {
      const target = await savesDir(id, game.savesDir, true);
      for (const f of input.files) {
        const w = await (await target.getFileHandle(f.name, { create: true })).createWritable();
        await w.write(f);
        await w.close();
      }
      render();
    };
    upload.append(input);
    const note = document.createElement("p");
    note.textContent = T.note;
    const persist = document.createElement("p");
    persist.textContent = (await navigator.storage.persisted?.()) ? T.persisted : T.notPersisted;
    panel.append(h2, list, upload, note, persist);
  };
  button.addEventListener("click", async () => {
    if (panel.hidden) {
      await navigator.storage.persist?.().catch(() => {});
      await render();
    }
    panel.hidden = !panel.hidden;
    if (panel.hidden) canvas.focus();
  });
}

canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("click", () => canvas.focus());
start().catch((e) => status(e.message, true));
</script>
</body>
</html>
